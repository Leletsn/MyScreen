<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyScreen 🎀</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="janela-topo">
            <div class="botoes-janela">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <span class="titulo-janela">MyScreen.exe</span>
        </div>

        <h1>🎀 MyScreen</h1>

        <p>Compartilhe sua tela com seus amigos.</p>


        <!-- NOME DO USUÁRIO -->

        <div class="nome-usuario">

            <input
                type="text"
                id="inputNome"
                placeholder="Digite seu nome"
                maxlength="20"
            >

        </div>


        <!-- CRIAR SALA -->

        <button id="btnCriarSala">
            ✨ Criar sala
        </button>


        <!-- ENTRAR EM SALA -->

        <div class="entrar">

            <input
                type="text"
                id="inputSala"
                placeholder="Digite o código da sala"
            >

            <button id="btnEntrarSala">
                🚪 Entrar na sala
            </button>

        </div>


        <!-- =========================
             SALA
        ========================== -->

        <div id="areaSala" style="display: none;">


            <!-- CABEÇALHO DA SALA -->

            <div class="cabecalho-sala">

                <div>

                    <h2>🏠 Sala</h2>

                    <p id="codigoSala"></p>

                </div>


                <div class="acoes-sala">

                    <button id="btnCopiar">
                        📋 Copiar código
                    </button>

                    <button id="btnSairSala">
                        🚪 Sair
                    </button>

                </div>

            </div>


            <!-- STATUS -->

            <p id="statusSala"></p>


            <!-- CONTEÚDO DA SALA -->

            <div class="conteudo-sala">


                <!-- PARTICIPANTES -->

                <div class="painel-participantes">

                    <h3>👥 Participantes</h3>

                    <ul id="listaParticipantes"></ul>

                </div>


                <!-- VÍDEOS -->

                <div class="area-videos">


                    <!-- MINHA TELA -->

                    <div class="video-container">

                        <h3>🖥️ Minha tela</h3>

                        <video
                            id="videoTela"
                            autoplay
                            muted
                        ></video>

                        <button id="btnTelaCheiaLocal">
                            ⛶ Tela cheia
                        </button>

                    </div>


                    <!-- TELA RECEBIDA -->

                    <div class="video-container">

                        <h3>👀 Tela recebida</h3>

                        <video
                            id="videoRemoto"
                            autoplay
                        ></video>

                        <button id="btnTelaCheia">
                            ⛶ Tela cheia
                        </button>

                    </div>


                </div>

            </div>


            <!-- CONTROLES -->

            <div class="controles-sala">

                <button id="btnCompartilhar">
                    🖥️ Compartilhar tela
                </button>

                <button id="btnMicrofone">
                    🎤 Microfone
                </button>

            </div>


        </div>
        <!-- FIM DA SALA -->


    </div>
    <!-- FIM DO CONTAINER -->


    <!-- SOCKET.IO -->

    <script src="/socket.io/socket.io.js"></script>

    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
